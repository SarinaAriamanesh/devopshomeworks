name: Deploy to Dokku

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH for Dokku
        run: |
          mkdir -p ~/.ssh
          cp /home/sarina/.ssh/id_gh_runner ~/.ssh/id_gh_runner
          chmod 600 ~/.ssh/id_gh_runner

          cat >> ~/.ssh/config <<'SSH'
          Host dokku-local
            HostName localhost
            User dokku
            IdentityFile ~/.ssh/id_gh_runner
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          SSH

      - name: Deploy application to Dokku
        run: |
          git remote remove dokku-ci 2>/dev/null || true
          git remote add dokku-ci dokku-local:task2-app
          git push dokku-ci HEAD:master --force
