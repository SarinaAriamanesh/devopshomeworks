name: Deploy to Dokku

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH for Dokku
        run: |
          chmod 600 /home/sarina/.ssh/id_gh_runner

          cat > /home/sarina/.ssh/config <<'SSH'
          Host dokku-local
            HostName localhost
            User dokku
            IdentityFile /home/sarina/.ssh/id_gh_runner
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          SSH

          chmod 600 /home/sarina/.ssh/config

      - name: Test Dokku connection
        run: |
          ssh dokku-local apps:list

      - name: Deploy application to Dokku
        run: |
          git remote remove dokku-ci 2>/dev/null || true
          git remote add dokku-ci dokku-local:task2-app
          git push dokku-ci HEAD:master --force
